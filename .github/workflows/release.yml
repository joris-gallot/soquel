name: Release

# Manual only, and it stops at a draft. Nothing here publishes: `releases/latest`,
# which the update service reads, excludes drafts, so a run cannot reach an
# installed client. Publishing the draft by hand is what ships a version.
on:
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: Build even if CI is not green on this commit
        type: boolean
        default: false

permissions:
  contents: write

# Never two at once, and never cancel one halfway: a half-uploaded draft is worse
# than a slow queue.
concurrency:
  group: release
  cancel-in-progress: false

env:
  TAURI_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # workflow_dispatch takes any ref, and a bundle built off a branch has a
      # provenance nobody can reconstruct a year later.
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release runs from main, not ${{ github.ref }}"
          exit 1

      # tauri.conf.json is the version the app reports and the updater compares
      # against, so it is the one that decides. Cargo.toml only has to agree.
      - name: Read the version
        id: version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          crate=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$crate" ]; then
            echo "::error::tauri.conf.json says $version and Cargo.toml says $crate"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"

      # The mistake this catches is forgetting to bump: the build would otherwise
      # attach a second set of bundles to a version already in the wild.
      - name: Refuse a version that already exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already a release: bump tauri.conf.json"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::the tag v$VERSION already exists"
            exit 1
          fi

      # Three outcomes worth telling apart: green, still running, and never ran.
      # They ask for different things, and "wait five minutes" is not "you forgot
      # to push".
      - name: Require CI to be green on this commit
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow=ci.yml --commit "$GITHUB_SHA" --limit 1 \
            --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
          case "$run" in
            "completed success") ;;
            '') echo "::error::no CI run for $GITHUB_SHA. Push it, or dispatch with skip_ci_check."; exit 1 ;;
            "completed "*) echo "::error::CI on $GITHUB_SHA finished ${run#completed }. Fix it, or dispatch with skip_ci_check."; exit 1 ;;
            *) echo "::error::CI on $GITHUB_SHA is still ${run% *}. Wait for it, or dispatch with skip_ci_check."; exit 1 ;;
          esac

      - name: Say that CI was not checked
        if: ${{ inputs.skip_ci_check }}
        run: |
          echo "::warning::built without checking CI, on request"
          echo "**CI was not checked.** Dispatched with skip_ci_check." >> "$GITHUB_STEP_SUMMARY"

      # The config carries an updater pubkey, so the build has to emit .sig files
      # and cannot do it without this key. Failing here beats failing mid-build.
      - name: Require the updater signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set, and tauri.conf.json expects signed updates"
            exit 1
          fi

  build:
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # Every platform's result, so one failure does not hide the state of the
      # other two on a release run.
      fail-fast: false
      matrix:
        include:
          # Universal, so one dmg covers Apple Silicon and Intel.
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: ubuntu-latest
            args: ''
            rust_targets: ''
          - os: windows-latest
            args: ''
            rust_targets: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $TAURI_DEPS

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Add the targets a universal binary needs
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          shared-key: release

      - run: pnpm install --frozen-lockfile

      # Said before the build, not after: a bundle that is unsigned when it was
      # meant to be signed is the failure worth naming out loud. Only macOS is
      # meant to be, for now, so only macOS gets a warning when it is not.
      - name: Report what will be signed
        shell: bash
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_NOTARY: ${{ secrets.APPLE_ID }}
        run: |
          say() { echo "$1"; echo "- $1" >> "$GITHUB_STEP_SUMMARY"; }
          echo "### ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          say "updater signature: yes, preflight requires the key"
          case "${{ runner.os }}" in
            macOS)
              [ -n "$APPLE_CERT" ] && say "code signature: Developer ID" || echo "::warning::macOS bundle will be UNSIGNED"
              [ -n "$APPLE_NOTARY" ] && say "notarisation: yes" || echo "::warning::macOS bundle will NOT be notarised"
              ;;
            Windows)
              # A deliberate choice for the first release, not an oversight.
              say "code signature: none, so SmartScreen warns until a reputation builds"
              ;;
            Linux)
              say "code signature: not a thing for AppImage or deb; the updater signature is what clients verify"
              ;;
          esac

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v${{ needs.preflight.outputs.version }}
          releaseName: soquel v${{ needs.preflight.outputs.version }}
          releaseDraft: true
          prerelease: false
          # latest.json is what the update service reads. Without it attached, the
          # service answers 204 forever and no client ever updates.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
