[package]
name = "soquel"
version = "0.1.0"
description = "Next generation database client"
license = "FSL-1.1-MIT"
authors = [ "Joris Gallot" ]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "soquel_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = [ "derive" ] }
log = "0.4"
tauri = { version = "2.11.3", features = [ "specta" ] }
tauri-plugin-log = "2"
specta = { version = "=2.0.0-rc.25", features = [ "derive" ] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = [
  "derive",
  "typescript"
] }
thiserror = "2"
uuid = { version = "1", features = [ "v4" ] }
keyring = "4.1"
async-trait = "0.1"
tokio-postgres = "0.7"
mysql_async = { version = "0.37", default-features = false, features = [ "default-rustls-ring" ] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = [
  "sync",
  "net",
  "io-util",
  "process",
  "rt",
  "time"
] }
shell-words = "1"
russh = { version = "0.61", default-features = false, features = [ "ring" ] }
deadpool = "0.13"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12"
] }
tokio-postgres-rustls = "0.14"
rustls-platform-verifier = "0.7"
rustls-pemfile = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.1", features = [
  "bundled",
  "column_decltype"
] }
redis = { version = "0.32.2", default-features = false, features = [
  "tokio-comp",
  "tokio-rustls-comp"
] }
mongodb = { version = "3.8", default-features = false, features = [
  "rustls-tls",
  "compat-3-0-0"
] }
rmcp = { version = "3.0", features = [
  "server",
  "macros",
  "transport-streamable-http-server"
] }
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "tokio"
] }
tokio-util = "0.7"
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "time"
] }
