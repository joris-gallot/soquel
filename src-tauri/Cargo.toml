[package]
name = "soquel"
version = "0.1.0"
description = "Next generation database client"
authors = [ "Joris Gallot" ]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "soquel_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = [ "derive" ] }
log = "0.4"
tauri = { version = "2.11.3", features = [ "specta" ] }
tauri-plugin-log = "2"
specta = { version = "=2.0.0-rc.25", features = [ "derive" ] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = [
  "derive",
  "typescript"
] }
thiserror = "2"
uuid = { version = "1", features = [ "v4" ] }
keyring = "4.1"

[dev-dependencies]
tempfile = "3"
