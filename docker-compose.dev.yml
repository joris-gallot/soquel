# Dev database: persistent, heavily seeded (pnpm db:dev:seed) to exercise the
# app with real volume. The market seed for landing screenshots will join later.
name: soquel-dev

services:
  postgres:
    image: postgres:18.4-alpine
    ports:
      - '5470:5432'
    environment:
      POSTGRES_USER: soquel
      POSTGRES_PASSWORD: soquel
      POSTGRES_DB: soquel_dev
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/dev-seed:/seeds:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U soquel -d soquel_dev]
      interval: 2s
      timeout: 3s
      retries: 15

  mysql:
    image: mysql:8.4
    ports:
      - '5471:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: soquel_dev
      MYSQL_USER: soquel
      MYSQL_PASSWORD: soquel
    volumes:
      - mysqldata:/var/lib/mysql
      - ./scripts/dev-seed:/seeds:ro
    healthcheck:
      test: [CMD-SHELL, mysqladmin ping -h 127.0.0.1 -usoquel -psoquel]
      interval: 2s
      timeout: 3s
      retries: 45

volumes:
  pgdata:
  mysqldata:
